<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>POPFRAME — hologram</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2307090d'/%3E%3Crect x='4' y='4' width='8' height='8' fill='none' stroke='%2337e0c8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/hologram.css" />
</head>
<body>
  <div id="stage"></div>

  <header id="topbar">
    <div class="brand">POP<span>FRAME</span></div>
    <div class="clock mono" id="clock">T+00:00.0</div>
  </header>

  <div id="landing">
    <div class="grid-bg"></div>
    <div class="panel">
      <div class="panel-head">
        <span class="dot"></span> SCENE INTAKE
        <span class="mock-chip mono" id="mockChip" hidden>MOCK</span>
      </div>

      <div id="dropzone" class="dropzone">
        <input type="file" id="fileInput" accept="image/*,video/*" hidden />
        <div id="dropHint" class="drop-hint">
          <div class="reticle"></div>
          <p>DROP IMAGE / VIDEO<br /><span>or click to choose</span></p>
        </div>
        <div id="framePreview" class="frame-preview" hidden>
          <img id="previewImg" alt="frame preview" />
          <div id="scanline" class="scanline" hidden></div>
        </div>
      </div>

      <div class="prompt-row">
        <input id="promptInput" type="text" placeholder="chair, plant, sneaker" autocomplete="off" spellcheck="false" />
        <button id="scanBtn" disabled>SCAN</button>
      </div>

      <div id="ticker" class="ticker mono" hidden></div>
      <div id="landingError" class="landing-error mono" hidden></div>
    </div>
  </div>

  <div id="emptyState" class="empty-state" hidden>
    <div class="panel">
      <div class="panel-head"><span class="dot warn"></span> NO OBJECTS MATCHED</div>
      <p>The prompt found nothing in this frame.<br />Try different object names.</p>
      <button id="retryBtn">NEW SCAN</button>
    </div>
  </div>

  <div id="banner" class="banner mono" hidden></div>

  <footer id="hudFooter" hidden>
    <div class="mono" id="sceneMeta"></div>
    <button id="rescanBtn">NEW SCAN</button>
  </footer>

  <script type="module" src="/src/hologram.js"></script>
</body>
</html>
