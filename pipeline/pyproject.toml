[project]
name = "promptable-world-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fal-client>=0.5",
    "python-dotenv>=1.0",
    "numpy",
    "pillow",
    "requests",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.9",
    "opencv-python-headless>=5.0.0.93",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
