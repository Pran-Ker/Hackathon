name: Hologram
options:
  bundleIdPrefix: com.hebbarpran
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  Hologram:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/Hologram
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hebbarpran.hologram
        INFOPLIST_FILE: Sources/Hologram/Info.plist
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: 7M3BLC8QM2
        PROVISIONING_PROFILE_SPECIFIER: match AppStore com.hebbarpran.hologram
      configs:
        debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"
          PROVISIONING_PROFILE_SPECIFIER: ""

schemes:
  Hologram:
    build:
      targets:
        Hologram: all
    run:
      config: Debug
    archive:
      config: Release
